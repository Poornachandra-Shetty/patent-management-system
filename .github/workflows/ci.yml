name: Backend CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Django Tests on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: patent_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/patent_db_test
          SECRET_KEY: ci-test-secret-key-that-is-long-enough-and-has-high-entropy-428937498
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECURE_SSL_REDIRECT: 'False'
        run: |
          cd backend
          pytest -v
